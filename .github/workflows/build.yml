name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
         python-version: '3.x'

      - name: Engage!
        run: make

      - name: Use tar to keep executable permissions
        run: make archive

      - name: Upload .app
        uses: actions/upload-artifact@v7
        with:
          name: OnAir.app.tgz
          path: dist/OnAir.app.tgz
          archive: false

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/OnAir.app.tgz --title "$GITHUB_REF_NAME" --generate-notes


name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
         python-version: '3.x'

      - name: Engage!
        run: make

      - name: Use tar to keep executable permissions
        run: make archive

      - name: Upload .app
        uses: actions/upload-artifact@v7
        with:
          name: OnAir.app.tgz
          path: dist/OnAir.app.tgz

